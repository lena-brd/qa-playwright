name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_EMAIL: ${{ secrets.APP_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      APP_CARD_NUMBER: ${{ secrets.APP_CARD_NUMBER }}
      HUB_EMAIL: ${{ secrets.HUB_EMAIL }}
      HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
      HUB_TEST_EMAIL: ${{ secrets.HUB_TEST_EMAIL }}
      RS_EMAIL: ${{ secrets.RS_EMAIL }}
      RS_PASSWORD: ${{ secrets.RS_PASSWORD }}
      RS_WRONG_EMAIL: ${{ secrets.RS_WRONG_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npx cucumber-js
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
